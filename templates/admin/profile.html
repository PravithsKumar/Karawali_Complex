{% extends 'base.html' %}

{% block title %}Admin Settings - Karavali Complex{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-6 space-y-6">
    <div class="flex items-center gap-3">
        <a href="{{ url_for('admin.dashboard') }}" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-xl font-bold text-slate-900">Admin Account Settings</h1>
            <p class="text-xs text-slate-500 mt-0.5">Update your username and secret password</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 sm:p-8">
        <form method="POST" action="{{ url_for('admin.profile') }}" class="space-y-5">
            <!-- Current Username -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Admin Username</label>
                <div class="relative">
                    <input type="text" name="username" value="{{ current_user.username }}" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                </div>
            </div>

            <div class="pt-3 border-t border-slate-100">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-3">Security & Password</span>

                <div class="space-y-4">
                    <!-- Current Password -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Current Password</label>
                        <input type="password" name="current_password" placeholder="Enter current password to verify" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>

                    <!-- New Password -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">New Password</label>
                        <input type="password" name="new_password" placeholder="Enter new password (optional)"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>

                    <!-- Confirm New Password -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Confirm New Password</label>
                        <input type="password" name="confirm_password" placeholder="Repeat new password"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save New Credentials</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
